name: Convert to Bedrock

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload to
        required: true

env:
  GDRIVE_ID: 186nlhNsT-6BERjD73h7bI-0TQtutkSgB
  BEDROCK_FORMAT: BEDROCK_1_20_80   # `-f ?` দিয়ে সাপোর্টেড লিস্ট দেখুন
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Download Chunker CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo HiveGamesOSS/Chunker \
            --pattern 'chunker-cli-*.jar' --output chunker-cli.jar

      - name: Download Java world from Drive
        run: |
          pip install gdown
          gdown "$GDRIVE_ID" -O world.zip
          file world.zip
          mkdir java_world
          unzip -q world.zip -d java_world
          LEVEL=$(find java_world -name level.dat | head -n1)
          test -n "$LEVEL" || { echo "level.dat not found"; exit 1; }
          echo "WORLD_DIR=$(dirname "$LEVEL")" >> "$GITHUB_ENV"

      - name: Convert
        run: |
          java -Xmx6G -jar chunker-cli.jar \
            -i "$WORLD_DIR" -f "$BEDROCK_FORMAT" -o bedrock_out

      - name: Package as .mcworld
        run: |
          cd bedrock_out
          zip -qr ../UncensoredLibrary-Bedrock.mcworld .

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" UncensoredLibrary-Bedrock.mcworld --clobber
