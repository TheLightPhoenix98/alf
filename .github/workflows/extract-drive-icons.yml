name: Extract Windows Drive Icons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract drive icons (multi-size .ico)
        shell: pwsh
        run: |
          $outDir = Join-Path (Get-Location) "icons"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          $refAsm = if ($PSVersionTable.PSVersion.Major -le 5) { 'System.Drawing' } else { 'System.Drawing.Common' }

          Add-Type -ReferencedAssemblies $refAsm -TypeDefinition @"
          using System;
          using System.Drawing;
          using System.IO;
          using System.Runtime.InteropServices;

          public static class IconTool {
              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
              struct SHSTOCKICONINFO {
                  public uint cbSize;
                  public IntPtr hIcon;
                  public int iSysImageIndex;
                  public int iIcon;
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 260)]
                  public string szPath;
              }

              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
              struct SHFILEINFO {
                  public IntPtr hIcon;
                  public int iIcon;
                  public uint dwAttributes;
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 260)]
                  public string szDisplayName;
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 80)]
                  public string szTypeName;
              }

              [DllImport("shell32.dll", SetLastError = true)]
              static extern int SHGetStockIconInfo(uint siid, uint uFlags, ref SHSTOCKICONINFO psii);

              [DllImport("shell32.dll", CharSet = CharSet.Unicode)]
              static extern IntPtr SHGetFileInfo(string pszPath, uint dwFileAttributes, ref SHFILEINFO psfi, uint cbFileInfo, uint uFlags);

              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              static extern uint PrivateExtractIcons(string szFileName, int nIconIndex, int cxIcon, int cyIcon, IntPtr[] phicon, uint[] piconid, uint nIcons, uint flags);

              [DllImport("user32.dll", SetLastError = true)]
              static extern bool DestroyIcon(IntPtr hIcon);

              const uint SHGSI_ICONLOCATION = 0x1000;
              const uint SHGFI_ICONLOCATION = 0x1000;

              static readonly int[] Sizes = new int[] { 16, 24, 32, 48, 64, 128, 256 };

              // Real drive path (e.g. "C:\") -> actual icon the shell shows (C: has the Windows logo)
              public static string ExportFromPath(string drivePath, string outFile) {
                  var fi = new SHFILEINFO();
                  SHGetFileInfo(drivePath, 0, ref fi, (uint)Marshal.SizeOf(fi), SHGFI_ICONLOCATION);
                  return Build(Environment.ExpandEnvironmentVariables(fi.szDisplayName), fi.iIcon, outFile);
              }

              // Stock icon id (8 = normal fixed drive, no Windows logo)
              public static string ExportStock(uint siid, string outFile) {
                  var info = new SHSTOCKICONINFO();
                  info.cbSize = (uint)Marshal.SizeOf(info);
                  int hr = SHGetStockIconInfo(siid, SHGSI_ICONLOCATION, ref info);
                  if (hr != 0) throw new Exception("SHGetStockIconInfo failed: " + hr);
                  return Build(Environment.ExpandEnvironmentVariables(info.szPath), info.iIcon, outFile);
              }

              static string Build(string file, int index, string outFile) {
                  byte[][] pngs = new byte[Sizes.Length][];
                  int[] dims = new int[Sizes.Length];
                  int count = 0;
                  foreach (int s in Sizes) {
                      IntPtr[] h = new IntPtr[1];
                      uint[] id = new uint[1];
                      uint n = PrivateExtractIcons(file, index, s, s, h, id, 1, 0);
                      if (n == 0 || n == 0xFFFFFFFF || h[0] == IntPtr.Zero) continue;
                      try {
                          using (Icon ic = Icon.FromHandle(h[0]))
                          using (Bitmap bmp = ic.ToBitmap())
                          using (Bitmap sized = new Bitmap(bmp, new Size(s, s)))
                          using (MemoryStream ms = new MemoryStream()) {
                              sized.Save(ms, System.Drawing.Imaging.ImageFormat.Png);
                              pngs[count] = ms.ToArray();
                              dims[count] = s;
                              count++;
                          }
                      } finally { DestroyIcon(h[0]); }
                  }
                  if (count == 0) throw new Exception("No icon extracted from " + file + " #" + index);

                  using (var fs = new FileStream(outFile, FileMode.Create))
                  using (var bw = new BinaryWriter(fs)) {
                      bw.Write((ushort)0);
                      bw.Write((ushort)1);
                      bw.Write((ushort)count);
                      int offset = 6 + 16 * count;
                      for (int i = 0; i < count; i++) {
                          byte d = dims[i] >= 256 ? (byte)0 : (byte)dims[i];
                          bw.Write(d);
                          bw.Write(d);
                          bw.Write((byte)0);
                          bw.Write((byte)0);
                          bw.Write((ushort)1);
                          bw.Write((ushort)32);
                          bw.Write((uint)pngs[i].Length);
                          bw.Write((uint)offset);
                          offset += pngs[i].Length;
                      }
                      for (int i = 0; i < count; i++) bw.Write(pngs[i]);
                  }
                  string list = "";
                  for (int i = 0; i < count; i++) list += (i > 0 ? "," : "") + dims[i];
                  return file + " #" + index + " -> " + count + " sizes (" + list + ")";
              }
          }
          "@

          # C: drive, Windows logo wala icon
          Write-Host (Join-Path $outDir "drive-system-c.ico")
          Write-Host ([IconTool]::ExportFromPath("C:\", (Join-Path $outDir "drive-system-c.ico")))

          # Normal drive icon (logo chhara)
          Write-Host ([IconTool]::ExportStock(8, (Join-Path $outDir "drive-normal.ico")))

          # Extra
          Write-Host ([IconTool]::ExportStock(7,  (Join-Path $outDir "drive-removable.ico")))
          Write-Host ([IconTool]::ExportStock(11, (Join-Path $outDir "drive-cd.ico")))
          Write-Host ([IconTool]::ExportStock(9,  (Join-Path $outDir "drive-network.ico")))

          Get-ChildItem $outDir | Format-Table Name, Length

      - name: Commit & Push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add icons/
          git diff --staged --quiet || git commit -m "Add Windows drive icons from windows-latest"
          git push
