name: installer-screenshots
on: workflow_dispatch

jobs:
  shots:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download + extract
        run: |
          pip install gdown
          gdown "1_qYPgoYbkdBE-B1SfW8orgUXGDz0Otuv" -O file.rar
          7z x file.rar -oiso_dir -y
          Remove-Item file.rar
          $iso = Get-ChildItem iso_dir -Recurse -Filter *.iso | Select-Object -First 1
          7z x $iso.FullName -odisc -y
          Remove-Item iso_dir -Recurse -Force

      - name: Click through + screenshots
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          New-Item -ItemType Directory shots | Out-Null
          function Shot($n) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("$PWD\shots\shot_$('{0:D2}' -f $n).png")
            $g.Dispose(); $bmp.Dispose()
          }
          Start-Process "$PWD\disc\setup.exe" -WorkingDirectory "$PWD\disc"
          Start-Sleep 5
          Shot 0
          for ($i = 1; $i -le 12; $i++) {
            [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
            Start-Sleep 2
            Shot $i
          }
          Get-Process | Where-Object { $_.MainWindowTitle } | Select ProcessName, MainWindowTitle

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots/
