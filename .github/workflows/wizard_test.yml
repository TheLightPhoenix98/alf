name: installer-screenshots
on: workflow_dispatch

jobs:
  shots:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download + extract
        run: |
          pip install gdown
          gdown "1_qYPgoYbkdBE-B1SfW8orgUXGDz0Otuv" -O file.rar
          7z x file.rar -oiso_dir -y
          Remove-Item file.rar
          $iso = Get-ChildItem iso_dir -Recurse -Filter *.iso | Select-Object -First 1
          7z x $iso.FullName -odisc -y
          Remove-Item iso_dir -Recurse -Force

      - name: Click through + screenshots
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          New-Item -ItemType Directory shots | Out-Null
          $script:n = 0
          function Shot {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("$PWD\shots\shot_$('{0:D2}' -f $script:n).png")
            $g.Dispose(); $bmp.Dispose()
            $script:n++
          }
          function Key($k) {
            [System.Windows.Forms.SendKeys]::SendWait($k)
            Start-Sleep 2
            Shot
          }

          Start-Process "$PWD\disc\setup.exe" -WorkingDirectory "$PWD\disc"
          Start-Sleep 5
          Shot                  # 00 Language
          Key "{ENTER}"         # 01 -> Splash
          Key "{ENTER}"         # 02 -> Welcome
          Key "{ENTER}"         # 03 -> License
          Key "{UP}"            # 04 accept
          Key "{ENTER}"         # 05 -> System Requirement
          Key "{ENTER}"         # 06 -> Setup Type
          Key "{ENTER}"         # 07 -> Destination
          Key "{ENTER}"         # 08 -> Register প্রশ্ন
          Key "n"               # 09 Register: No -> Shortcut প্রশ্ন
          Key "y"               # 10 Shortcut: Yes -> Start Copying Files
          Key "{ENTER}"         # 11 -> কপি শুরু

          # ৬ মিনিট (২৪ x ১৫ সেকেন্ড)
          $dir = "C:\Program Files (x86)\Rockstar Games\GTA San Andreas"
          for ($i = 0; $i -lt 24; $i++) {
            Start-Sleep 15
            Shot
            if (Test-Path $dir) {
              $size = (Get-ChildItem $dir -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
              Write-Host "size: $size"
              if ($size -gt 4900000000) { break }
            }
          }
          Start-Sleep 5
          Shot
          Get-Process | Where-Object { $_.MainWindowTitle } | Select ProcessName, MainWindowTitle

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots/
