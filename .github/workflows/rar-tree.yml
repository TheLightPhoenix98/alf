name: rar-tree
on: workflow_dispatch

jobs:
  list:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download
        run: |
          pip install gdown
          gdown "1_qYPgoYbkdBE-B1SfW8orgUXGDz0Otuv" -O file.rar



      - name: Tree (extract ছাড়া)
        run: 7z l file.rar

     
      - name: ISO এর ভেতরের তালিকা
        run: |
          7z x file.rar -oout -y
          7z l "out\Grand Theft Auto - San Andreas PC\GTA San Andreas PC.iso"
