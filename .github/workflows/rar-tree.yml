name: rar-tree
on: workflow_dispatch

jobs:
  list:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download
        run: |
          pip install gdown
          gdown --fuzzy "https://drive.google.com/file/d/1_qYPgoYbkdBE-B1SfW8orgUXGDz0Otuv/view?usp=drivesdk" -O file.rar

      - name: Tree (extract ছাড়া)
        run: 7z l file.rar

     
